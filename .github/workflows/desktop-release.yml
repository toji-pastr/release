name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private source branch/tag to build"
        required: false
        default: "staging"
      build_channel:
        description: "Build channel"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production
  repository_dispatch:
    types:
      - build-desktop-staging
      - build-desktop-release

permissions:
  contents: write

env:
  RETAIN_PREVIOUS_RELEASES: 5

concurrency:
  group: desktop-build-${{ github.event_name }}-${{ github.event_name == 'repository_dispatch' && github.event.action || inputs.build_channel || 'staging' }}
  cancel-in-progress: ${{ (github.event_name == 'repository_dispatch' && github.event.action == 'build-desktop-staging') || (github.event_name == 'workflow_dispatch' && inputs.build_channel == 'staging') }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.vars.outputs.source_ref }}
      build_channel: ${{ steps.vars.outputs.build_channel }}
      release_tag: ${{ steps.vars.outputs.release_tag }}
    steps:
      - name: Resolve build inputs
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            SOURCE_REF="${{ github.event.client_payload.source_ref }}"
            if [[ "${{ github.event.action }}" == "build-desktop-release" ]]; then
              BUILD_CHANNEL="production"
            else
              BUILD_CHANNEL="staging"
            fi
          else
            SOURCE_REF="${{ inputs.source_ref }}"
            BUILD_CHANNEL="${{ inputs.build_channel }}"
          fi

          echo "source_ref=${SOURCE_REF:-staging}" >> "$GITHUB_OUTPUT"
          echo "build_channel=${BUILD_CHANNEL:-staging}" >> "$GITHUB_OUTPUT"

          if [[ "${BUILD_CHANNEL:-staging}" == "production" ]]; then
            RELEASE_TAG="${SOURCE_REF:-}"
            if [[ -z "${RELEASE_TAG}" ]]; then
              echo "Production builds require a source_ref tag." >&2
              exit 1
            fi
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Production builds require a semver tag like v1.0.0. Received: ${RELEASE_TAG}" >&2
              exit 1
            fi
            echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

  build-mac:
    runs-on: ${{ matrix.os }}
    needs: prepare
    environment: ${{ needs.prepare.outputs.build_channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64

    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: Lstsk/control
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.source_ref }}
          path: source

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install

      - name: Create desktop env
        working-directory: source/apps/desktop
        shell: bash
        env:
          BUILD_CHANNEL: ${{ needs.prepare.outputs.build_channel }}
          DESKTOP_API_BASE_URL: ${{ secrets.DESKTOP_API_BASE_URL }}
          DESKTOP_BIFROST_PROXY_URL: ${{ secrets.DESKTOP_BIFROST_PROXY_URL }}
          DESKTOP_SUPABASE_URL: ${{ secrets.DESKTOP_SUPABASE_URL }}
          DESKTOP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DESKTOP_SUPABASE_PUBLISHABLE_KEY }}
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_AUTH_WEB_BASE_URL: ${{ secrets.DESKTOP_AUTH_WEB_BASE_URL }}
          DESKTOP_REALTIME_WS_URL: ${{ secrets.DESKTOP_REALTIME_WS_URL }}
        run: |
          cat > ".env.${BUILD_CHANNEL}" <<EOF
          APP_ENV=${BUILD_CHANNEL}
          API_BASE_URL=${DESKTOP_API_BASE_URL}
          BIFROST_PROXY_URL=${DESKTOP_BIFROST_PROXY_URL}
          NEXT_PUBLIC_SUPABASE_URL=${DESKTOP_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${DESKTOP_SUPABASE_PUBLISHABLE_KEY}
          DESKTOP_OAUTH_CLIENT_ID=${DESKTOP_OAUTH_CLIENT_ID}
          AUTH_WEB_BASE_URL=${DESKTOP_AUTH_WEB_BASE_URL}
          REALTIME_WS_URL=${DESKTOP_REALTIME_WS_URL}
          NODE_ENV=production
          EOF

      - name: Prepare Apple API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_RAW: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          APPLE_API_KEY_ID_CLEAN="$(printf '%s' "$APPLE_API_KEY_ID_RAW" | tr -d '\r\n')"
          APPLE_API_KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID_CLEAN}.p8"
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$APPLE_API_KEY_PATH"
          {
            echo "APPLE_API_KEY_ID_CLEAN=$APPLE_API_KEY_ID_CLEAN"
            echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Build mac app
        working-directory: source/apps/desktop
        env:
          APP_ENV: ${{ needs.prepare.outputs.build_channel }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$APPLE_API_KEY_PATH"
          export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_CLEAN"
          pnpm run dist:mac -- --${{ matrix.arch }}

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ needs.prepare.outputs.build_channel }}-${{ matrix.arch }}
          path: |
            source/apps/desktop/release/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    needs: prepare
    environment: ${{ needs.prepare.outputs.build_channel }}

    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: Lstsk/control
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.source_ref }}
          path: source

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install

      - name: Create desktop env
        working-directory: source/apps/desktop
        shell: pwsh
        env:
          BUILD_CHANNEL: ${{ needs.prepare.outputs.build_channel }}
          DESKTOP_API_BASE_URL: ${{ secrets.DESKTOP_API_BASE_URL }}
          DESKTOP_BIFROST_PROXY_URL: ${{ secrets.DESKTOP_BIFROST_PROXY_URL }}
          DESKTOP_SUPABASE_URL: ${{ secrets.DESKTOP_SUPABASE_URL }}
          DESKTOP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DESKTOP_SUPABASE_PUBLISHABLE_KEY }}
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_AUTH_WEB_BASE_URL: ${{ secrets.DESKTOP_AUTH_WEB_BASE_URL }}
          DESKTOP_REALTIME_WS_URL: ${{ secrets.DESKTOP_REALTIME_WS_URL }}
        run: |
          $buildChannel = $env:BUILD_CHANNEL
          $envContent = @"
          APP_ENV=$buildChannel
          API_BASE_URL=$env:DESKTOP_API_BASE_URL
          BIFROST_PROXY_URL=$env:DESKTOP_BIFROST_PROXY_URL
          NEXT_PUBLIC_SUPABASE_URL=$env:DESKTOP_SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$env:DESKTOP_SUPABASE_PUBLISHABLE_KEY
          DESKTOP_OAUTH_CLIENT_ID=$env:DESKTOP_OAUTH_CLIENT_ID
          AUTH_WEB_BASE_URL=$env:DESKTOP_AUTH_WEB_BASE_URL
          REALTIME_WS_URL=$env:DESKTOP_REALTIME_WS_URL
          NODE_ENV=production
          "@.Trim()
          $envContent | Set-Content -Path ".env.$buildChannel" -Encoding ascii

      - name: Build win app
        working-directory: source/apps/desktop
        env:
          APP_ENV: ${{ needs.prepare.outputs.build_channel }}
        run: pnpm run dist:win

      - name: Upload win artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win-${{ needs.prepare.outputs.build_channel }}
          path: |
            source/apps/desktop/release/*.exe
          if-no-files-found: error

  publish-production:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-mac
      - build-win
    if: needs.prepare.outputs.build_channel == 'production'
    environment: production

    steps:
      - name: Checkout public release repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop/release
          merge-multiple: true

      - name: Create stable download aliases
        run: node scripts/alias-release.mjs desktop/release

      - name: Generate checksums
        run: node scripts/hash-release.mjs desktop/release checksums.txt

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la desktop/release
          test -f desktop/release/System-Audio-Service-Setup.exe
          test -f desktop/release/System-Audio-Service-arm64.dmg
          test -f desktop/release/System-Audio-Service-x64.dmg
          test -f desktop/release/checksums.txt

      - name: Build manifest
        env:
          DOWNLOAD_PUBLIC_BASE_URL: ${{ secrets.DOWNLOAD_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          node scripts/build-release-manifest.mjs \
            desktop/release \
            "${{ needs.prepare.outputs.release_tag }}" \
            "${DOWNLOAD_PUBLIC_BASE_URL}"

      - name: Upload production release to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          : "${R2_BUCKET:?Missing R2_BUCKET secret}"
          : "${R2_ENDPOINT_URL:?Missing R2_ENDPOINT_URL secret}"
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY secret}"

          aws --version

          aws s3 sync desktop/release "s3://${R2_BUCKET}/${{ needs.prepare.outputs.release_tag }}/" \
            --endpoint-url "${R2_ENDPOINT_URL}" \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.exe" \
            --include "checksums.txt" \
            --include "manifest.json"

          aws s3 sync desktop/release "s3://${R2_BUCKET}/latest/" \
            --endpoint-url "${R2_ENDPOINT_URL}" \
            --delete \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.exe" \
            --include "checksums.txt" \
            --include "manifest.json"

          aws s3 cp desktop/release/manifest.json "s3://${R2_BUCKET}/manifest.json" \
            --endpoint-url "${R2_ENDPOINT_URL}"

      - name: Prune old Cloudflare R2 releases
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          node scripts/prune-release-prefixes.mjs desktop/release/manifest.json
