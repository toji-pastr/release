name: Control Containers

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact Control commit for production; a branch or commit for staging
        required: true
        default: staging
      build_channel:
        description: Image channel and GitHub environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      deploy:
        description: Trigger Coolify after both images are promoted
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types:
      - build-control-containers

permissions:
  contents: read

concurrency:
  group: control-containers-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.build_channel || inputs.build_channel || 'staging' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve trusted source
    runs-on: ubuntu-24.04
    outputs:
      build_channel: ${{ steps.inputs.outputs.build_channel }}
      should_deploy: ${{ steps.inputs.outputs.should_deploy }}
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Resolve workflow inputs
        id: inputs
        env:
          DISPATCH_CHANNEL: ${{ github.event.client_payload.build_channel }}
          DISPATCH_DEPLOY: ${{ github.event.client_payload.deploy }}
          DISPATCH_REF: ${{ github.event.client_payload.source_ref }}
          MANUAL_CHANNEL: ${{ inputs.build_channel }}
          MANUAL_DEPLOY: ${{ inputs.deploy }}
          MANUAL_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            SOURCE_REF="${DISPATCH_REF}"
            BUILD_CHANNEL="${DISPATCH_CHANNEL}"
            SHOULD_DEPLOY="${DISPATCH_DEPLOY:-false}"
          else
            SOURCE_REF="${MANUAL_REF}"
            BUILD_CHANNEL="${MANUAL_CHANNEL}"
            SHOULD_DEPLOY="${MANUAL_DEPLOY:-false}"
          fi

          : "${SOURCE_REF:?Missing source_ref}"
          case "${BUILD_CHANNEL}" in
            staging|production)
              ;;
            *)
              echo "Unsupported build channel: ${BUILD_CHANNEL}" >&2
              exit 1
              ;;
          esac

          if [[ "${BUILD_CHANNEL}" == "production" && ! "${SOURCE_REF}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "Production container builds require an exact source commit SHA." >&2
            exit 1
          fi

          if [[ "${SHOULD_DEPLOY}" == "true" ]]; then
            SHOULD_DEPLOY=true
          else
            SHOULD_DEPLOY=false
          fi

          {
            echo "source_ref=${SOURCE_REF}"
            echo "build_channel=${BUILD_CHANNEL}"
            echo "should_deploy=${SHOULD_DEPLOY}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out allowlisted Control source
        uses: actions/checkout@v6
        with:
          repository: Lstsk/control
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ steps.inputs.outputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "Unexpected source commit: ${SOURCE_SHA}" >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.build_channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/toji-pastr/control-web
          - target: realtime
            dockerfile: apps/realtime/Dockerfile
            image: ghcr.io/toji-pastr/control-realtime

    steps:
      - name: Check out allowlisted Control source
        uses: actions/checkout@v6
        with:
          repository: Lstsk/control
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Prepare web build arguments
        id: build-args
        if: matrix.target == 'web'
        env:
          APP_ENV: ${{ needs.prepare.outputs.build_channel }}
          WEB_APP_URL: ${{ secrets.DESKTOP_API_BASE_URL }}
          WEB_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DESKTOP_SUPABASE_PUBLISHABLE_KEY }}
          WEB_SUPABASE_URL: ${{ secrets.DESKTOP_SUPABASE_URL }}
          WEB_UMAMI_ENABLED: ${{ needs.prepare.outputs.build_channel == 'production' && '1' || '0' }}
          WEB_UMAMI_HOST: ${{ needs.prepare.outputs.build_channel == 'production' && 'https://analytics.trycontrol.app' || '' }}
          WEB_UMAMI_WEBSITE_ID: ${{ needs.prepare.outputs.build_channel == 'production' && '2fa5c035-3759-439f-9670-814686b09417' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${WEB_APP_URL:?Missing DESKTOP_API_BASE_URL environment secret}"
          : "${WEB_SUPABASE_URL:?Missing DESKTOP_SUPABASE_URL environment secret}"
          : "${WEB_SUPABASE_PUBLISHABLE_KEY:?Missing DESKTOP_SUPABASE_PUBLISHABLE_KEY environment secret}"

          case "${WEB_UMAMI_ENABLED}" in
            0|1)
              ;;
            *)
              echo "WEB_UMAMI_ENABLED must be 0 or 1." >&2
              exit 1
              ;;
          esac

          if [[ "${WEB_UMAMI_ENABLED}" == "1" ]]; then
            : "${WEB_UMAMI_HOST:?Missing production Umami host}"
            : "${WEB_UMAMI_WEBSITE_ID:?Missing production Umami website ID}"
            if [[ ! "${WEB_UMAMI_HOST}" =~ ^https://[^/]+/?$ ]]; then
              echo "The production Umami host must be an HTTPS origin without a path." >&2
              exit 1
            fi
            if [[ ! "${WEB_UMAMI_WEBSITE_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
              echo "The production Umami website ID must be a UUID." >&2
              exit 1
            fi
          fi

          {
            echo "value<<EOF"
            echo "APP_ENV=${APP_ENV}"
            echo "NEXT_PUBLIC_APP_URL=${WEB_APP_URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${WEB_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${WEB_SUPABASE_PUBLISHABLE_KEY}"
            echo "NEXT_PUBLIC_UMAMI_ENABLED=${WEB_UMAMI_ENABLED}"
            echo "NEXT_PUBLIC_UMAMI_HOST=${WEB_UMAMI_HOST}"
            echo "NEXT_PUBLIC_UMAMI_WEBSITE_ID=${WEB_UMAMI_WEBSITE_ID}"
            echo "NEXT_PUBLIC_UMAMI_ENVIRONMENT=${APP_ENV}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.CONTROL_GHCR_USERNAME }}
          password: ${{ secrets.CONTROL_GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:sha-${{ needs.prepare.outputs.source_sha }}
          build-args: ${{ steps.build-args.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.title=Control ${{ matrix.target }}

  promote:
    name: Promote ${{ needs.prepare.outputs.build_channel }} images
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.build_channel }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.CONTROL_GHCR_USERNAME }}
          password: ${{ secrets.CONTROL_GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote matching image pair
        env:
          BUILD_CHANNEL: ${{ needs.prepare.outputs.build_channel }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "ghcr.io/toji-pastr/control-web:sha-${SOURCE_SHA}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/toji-pastr/control-realtime:sha-${SOURCE_SHA}" >/dev/null

          docker buildx imagetools create \
            --tag "ghcr.io/toji-pastr/control-web:${BUILD_CHANNEL}" \
            "ghcr.io/toji-pastr/control-web:sha-${SOURCE_SHA}"

          docker buildx imagetools create \
            --tag "ghcr.io/toji-pastr/control-realtime:${BUILD_CHANNEL}" \
            "ghcr.io/toji-pastr/control-realtime:sha-${SOURCE_SHA}"

  deploy:
    name: Deploy through Coolify
    needs:
      - prepare
      - promote
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.build_channel }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Connect to the deployment tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:control-deploy
          ping: ${{ vars.CONTROL_COOLIFY_TAILSCALE_IP }}

      - name: Verify Coolify pulls images before stopping containers
        env:
          COOLIFY_TAILSCALE_IP: ${{ vars.CONTROL_COOLIFY_TAILSCALE_IP }}
          COOLIFY_TOKEN: ${{ secrets.CONTROL_COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.CONTROL_COOLIFY_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          : "${COOLIFY_TAILSCALE_IP:?Missing CONTROL_COOLIFY_TAILSCALE_IP environment variable}"
          : "${COOLIFY_TOKEN:?Missing CONTROL_COOLIFY_TOKEN environment secret}"
          : "${COOLIFY_WEBHOOK:?Missing CONTROL_COOLIFY_WEBHOOK environment secret}"

          if [[ ! "${COOLIFY_WEBHOOK}" =~ ^(https://([^/:]+))(/|$) ]]; then
            echo "CONTROL_COOLIFY_WEBHOOK must use HTTPS." >&2
            exit 1
          fi
          COOLIFY_ORIGIN="${BASH_REMATCH[1]}"
          COOLIFY_HOST="${BASH_REMATCH[2]}"
          APPLICATION_UUID="$(sed -nE 's/.*[?&]uuid=([A-Za-z0-9_-]+).*/\1/p' <<<"${COOLIFY_WEBHOOK}")"
          if [[ -z "${APPLICATION_UUID}" ]]; then
            echo "CONTROL_COOLIFY_WEBHOOK must include the target application UUID." >&2
            exit 1
          fi
          APPLICATION_URL="${COOLIFY_ORIGIN}/api/v1/applications/${APPLICATION_UUID}"

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --resolve "${COOLIFY_HOST}:443:${COOLIFY_TAILSCALE_IP}" \
            --request GET "${APPLICATION_URL}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}")"
          BUILD_COMMAND="$(jq -er '.docker_compose_custom_build_command' <<<"${RESPONSE}")"

          if [[ "${BUILD_COMMAND}" != "docker compose pull" ]]; then
            echo "Refusing to deploy: Coolify must run 'docker compose pull' before removing the running containers." >&2
            exit 1
          fi

      - name: Trigger allowlisted Control deployment
        id: trigger
        env:
          COOLIFY_TAILSCALE_IP: ${{ vars.CONTROL_COOLIFY_TAILSCALE_IP }}
          COOLIFY_TOKEN: ${{ secrets.CONTROL_COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.CONTROL_COOLIFY_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          : "${COOLIFY_TAILSCALE_IP:?Missing CONTROL_COOLIFY_TAILSCALE_IP environment variable}"
          : "${COOLIFY_TOKEN:?Missing CONTROL_COOLIFY_TOKEN environment secret}"
          : "${COOLIFY_WEBHOOK:?Missing CONTROL_COOLIFY_WEBHOOK environment secret}"

          if [[ ! "${COOLIFY_WEBHOOK}" =~ ^https://([^/:]+)/ ]]; then
            echo "CONTROL_COOLIFY_WEBHOOK must use HTTPS." >&2
            exit 1
          fi
          COOLIFY_HOST="${BASH_REMATCH[1]}"

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --resolve "${COOLIFY_HOST}:443:${COOLIFY_TAILSCALE_IP}" \
            --request GET "${COOLIFY_WEBHOOK}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}")"
          echo "${RESPONSE}"

          DEPLOYMENT_UUID="$(jq -er '.deployments[0].deployment_uuid // .deployment_uuid' <<<"${RESPONSE}")"
          echo "deployment_uuid=${DEPLOYMENT_UUID}" >> "${GITHUB_OUTPUT}"

      - name: Wait for successful Coolify deployment
        env:
          COOLIFY_TAILSCALE_IP: ${{ vars.CONTROL_COOLIFY_TAILSCALE_IP }}
          COOLIFY_TOKEN: ${{ secrets.CONTROL_COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.CONTROL_COOLIFY_WEBHOOK }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOYMENT_UUID:?Missing deployment UUID}"

          if [[ ! "${COOLIFY_WEBHOOK}" =~ ^(https://([^/:]+))(/|$) ]]; then
            echo "CONTROL_COOLIFY_WEBHOOK must use HTTPS." >&2
            exit 1
          fi
          COOLIFY_ORIGIN="${BASH_REMATCH[1]}"
          COOLIFY_HOST="${BASH_REMATCH[2]}"
          DEPLOYMENT_URL="${COOLIFY_ORIGIN}/api/v1/deployments/${DEPLOYMENT_UUID}"

          for attempt in {1..90}; do
            RESPONSE="$(curl --fail-with-body --silent --show-error \
              --resolve "${COOLIFY_HOST}:443:${COOLIFY_TAILSCALE_IP}" \
              --request GET "${DEPLOYMENT_URL}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}")"
            STATUS="$(jq -er '.status' <<<"${RESPONSE}")"
            echo "Coolify deployment ${DEPLOYMENT_UUID}: ${STATUS}"

            case "${STATUS}" in
              finished)
                exit 0
                ;;
              failed|cancelled)
                jq -r '.logs // "No deployment logs returned."' <<<"${RESPONSE}" >&2
                exit 1
                ;;
              queued|in_progress)
                sleep 5
                ;;
              *)
                echo "Unexpected Coolify deployment status: ${STATUS}" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Coolify deployment ${DEPLOYMENT_UUID}." >&2
          exit 1
